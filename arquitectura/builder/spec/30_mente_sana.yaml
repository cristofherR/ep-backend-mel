layer: mente_sana
order: 30
prefix: ms_
dialect: postgres
proyecto: MS
descripcion: |
  Capa 3 — Módulo Mente Sana (transición primaria-secundaria). Reusa el núcleo
  (IE x Nivel via core_ie.cod_unico) y el motor de instrumentos. Agrega el módulo
  propio Estudiante (observación de habilidades) que CCA no tiene.
tables:
  - name: ms_roster
    nota: Roster por IE/Nivel/Grado (MS distingue primaria y secundaria).
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: ie_id, type: "int", notnull: true, fk: "core_ie.id"}
      - {name: grado, type: "nvarchar(20)"}
      - {name: persona_id, type: "int", fk: "core_persona.id"}
      - {name: apellidos_nombres, type: "nvarchar(200)"}
      - {name: activo, type: "bit", default: "1"}
  - name: ms_sesion
    nota: Sesión ejecutada (Reporte al día). Incluye Asist_Estudiantes (propio de MS).
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: core_sesion_id, type: "int", fk: "core_sesion.id"}
      - {name: ie_id, type: "int", notnull: true, fk: "core_ie.id"}
      - {name: grado, type: "nvarchar(20)"}
      - {name: etapa_id, type: "int", fk: "core_etapa.id"}
      - {name: tema, type: "nvarchar(200)"}
      - {name: asist_estudiantes, type: "int", default: "0"}
      - {name: asist_familias, type: "int", default: "0"}
      - {name: asist_docentes, type: "int", default: "0"}
      - {name: asist_otros_cant, type: "int", default: "0"}
      - {name: asist_otros_texto, type: "nvarchar(120)"}
      - {name: desarrollo, type: "nvarchar(max)"}
      - {name: incidencia_sn, type: "bit", default: "0"}
      - {name: descripcion_incidencia, type: "nvarchar(max)"}
  - name: ms_asistencia
    nota: Asistencia persona x sesión (mismo patrón que CCA).
    columns:
      - {name: id, type: "bigint", identity: true, pk: true}
      - {name: ms_sesion_id, type: "int", notnull: true, fk: "ms_sesion.id"}
      - {name: roster_id, type: "int", notnull: true, fk: "ms_roster.id"}
      - {name: asistio, type: "bit", default: "0"}
  - name: ms_evaluacion_estudiante
    nota: "Módulo propio MS: observación de habilidades (Bloq_1..5 + conductas) por corte."
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: ie_id, type: "int", notnull: true, fk: "core_ie.id"}
      - {name: grado, type: "nvarchar(20)"}
      - {name: seccion, type: "nvarchar(10)"}
      - {name: persona_id, type: "int", fk: "core_persona.id"}
      - {name: intento_id, type: "int", fk: "inst_intento.id", note: "corte + IE + facilitador"}
      - {name: lenguaje_corporal, type: "varchar(20)"}
      - {name: contacto_visual, type: "varchar(20)"}
      - {name: tono_volumen_voz, type: "varchar(20)"}
      - {name: tiempo_reaccion, type: "varchar(20)"}
      - {name: interaccion_material, type: "varchar(20)"}
      - {name: conducta_social, type: "varchar(20)"}
      - {name: comentario, type: "nvarchar(max)"}
indexes:
  - {table: ms_asistencia, name: ix_ms_asist_sesion, cols: [ms_sesion_id]}
  - {table: ms_roster, name: ix_ms_roster_ie, cols: [ie_id, grado]}
