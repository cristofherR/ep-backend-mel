layer: academia_juvenil
order: 50
prefix: aj_
dialect: postgres
proyecto: AJ
descripcion: |
  Capa 5 — ESQUELETO Academia Juvenil (componente PROG-8). Ya existe trabajo previo
  (Power BI + Deneb: radar de habilidades + cartilla por estudiante). El radar se
  modela como habilidades + evaluaciones por corte; la cartilla como snapshot.
tables:
  - name: aj_habilidad
    nota: Dimensión del radar de habilidades (eje).
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: codigo, type: "varchar(30)", notnull: true, unique: true}
      - {name: nombre, type: "nvarchar(120)", notnull: true}
      - {name: orden, type: "smallint"}
  - name: aj_participante
    nota: Estudiante de la Academia Juvenil.
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: ie_id, type: "int", fk: "core_ie.id"}
      - {name: persona_id, type: "int", fk: "core_persona.id"}
      - {name: cohorte, type: "varchar(20)"}
      - {name: activo, type: "bit", default: "1"}
  - name: aj_evaluacion_habilidad
    nota: Valor por participante x habilidad x corte (alimenta el radar).
    columns:
      - {name: id, type: "bigint", identity: true, pk: true}
      - {name: participante_id, type: "int", notnull: true, fk: "aj_participante.id"}
      - {name: habilidad_id, type: "int", notnull: true, fk: "aj_habilidad.id"}
      - {name: corte_id, type: "int", fk: "core_catalogo_item.id"}
      - {name: valor, type: "decimal(6,2)"}
  - name: aj_cartilla
    nota: Cartilla (snapshot) por participante; semáforo HSE y fuente centro poblado por confirmar.
    columns:
      - {name: id, type: "int", identity: true, pk: true}
      - {name: participante_id, type: "int", notnull: true, fk: "aj_participante.id"}
      - {name: periodo_id, type: "int", fk: "core_periodo.id"}
      - {name: semaforo_id, type: "int", fk: "core_catalogo_item.id"}
      - {name: url, type: "nvarchar(500)"}
indexes:
  - {table: aj_evaluacion_habilidad, name: ix_aj_eval_part, cols: [participante_id, habilidad_id]}
